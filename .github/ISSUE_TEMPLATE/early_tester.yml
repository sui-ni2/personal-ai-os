name: Early tester feedback
description: Report a genuine first-run test with or without a provider API key.
title: "[Early test]: "
labels:
  - help wanted
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing Personal AI OS. Do not include API keys, `.env` contents, authorization headers, cookies, private conversations, runtime databases, or unsanitized logs.

        Start with the [five-minute UI guide](https://github.com/sui-ni2/personal-ai-os/blob/main/docs/5-minute-evaluation.md) and [short test packet](https://github.com/sui-ni2/personal-ai-os/blob/main/docs/external-test-packet.md). Use Projects → Control for ordinary project updates; no API command is needed. No-key project/persistence testing is useful, with real chat marked not tested.

        The optional developer no-key smoke in docs/try-without-api.md checks startup behavior; it is not a real user workflow or independent adoption proof.
  - type: dropdown
    id: path
    attributes:
      label: Test path
      description: Which first-run path did you test?
      options:
        - Path A — no API key / zero-cost readiness
        - Path B — provider connection and first chat
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version or commit
      placeholder: Full tested main commit SHA, or tag plus SHA
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04, etc.
    validations:
      required: true
  - type: input
    id: runtimes
    attributes:
      label: Runtime versions
      description: Include Python and Node/pnpm when relevant.
      placeholder: Python 3.12.13; Node 24; pnpm 11.16.0
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Overall result
      options:
        - Passed as expected
        - Passed with confusing or rough steps
        - Partial; one or more steps failed or were not tested
        - Failed with a reproducible problem
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you test?
      description: Include install/startup results, your workflow, Projects → Control, chat/provider (or not tested), service restart, and project/conversation persistence. State whether this was a fresh install or an existing checkout.
      placeholder: "Install: ...\nStartup: ...\nMy workflow: ...\nControl updates: ...\nChat: ...\nService restart: ...\nPersistence: ..."
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Feedback or reproducible problem
      description: Describe anything confusing, broken, unexpectedly difficult, or especially clear.
    validations:
      required: true
  - type: textarea
    id: sanitized_evidence
    attributes:
      label: Sanitized evidence (optional)
      description: Add only excerpts or screenshots that contain no credentials or private user data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private conversations, runtime databases, cookies, authorization headers, and other private data from this report.
          required: true
