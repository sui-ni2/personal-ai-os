name: One-shot dependency sync

on:
  push:
    branches:
      - "deps/sync-vinext-node-types-20260922"
    paths:
      - ".github/workflows/one-shot-dependency-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Update dependency specs
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "apps/web/package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          pkg.devDependencies["vinext"] = "1.0.0-beta.10";
          pkg.devDependencies["@types/node"] = "^24.13.5";
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          NODE
      - name: Regenerate lockfile
        run: |
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
      - name: Validate combined dependency state
        run: |
          pnpm check:web
          pnpm build
          git diff --check
      - name: Commit dependency sync and remove one-shot workflow
        run: |
          git rm .github/workflows/one-shot-dependency-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json pnpm-lock.yaml
          git commit -m "chore(deps): sync vinext and node types"
          git push origin HEAD:deps/sync-vinext-node-types-20260922
