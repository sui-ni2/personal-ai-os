name: Platform Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "compose.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "requirements-*.txt"
      - "apps/**"
      - "packages/**"
      - "scripts/release-provider-smoke.py"
      - "scripts/check-mobile-readiness.ps1"
      - "scripts/setup-windows.ps1"
      - ".github/workflows/platform-readiness.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "compose.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "requirements-*.txt"
      - "apps/**"
      - "packages/**"
      - "scripts/release-provider-smoke.py"
      - "scripts/check-mobile-readiness.ps1"
      - "scripts/setup-windows.ps1"
      - ".github/workflows/platform-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-no-key:
    name: Windows no-key readiness
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Verify Windows first-run bootstrap end to end
        run: ./scripts/setup-windows.ps1

  container:
    name: Container build, health, and mobile shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config
      - name: Build Compose application
        run: docker compose build
      - name: Start Compose application and verify health
        shell: bash
        run: |
          docker compose up -d

          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health; then
              echo
              exit 0
            fi
            sleep 2
          done

          echo "Compose application did not become healthy" >&2
          docker compose ps >&2 || true
          docker compose logs >&2 || true
          exit 1
      - name: Verify production mobile/PWA readiness
        shell: pwsh
        run: |
          ./scripts/check-mobile-readiness.ps1 -BaseUrl "http://127.0.0.1:8080" -AllowInsecureLocalhost
      - name: Clean up Compose application
        if: always()
        run: docker compose down -v --remove-orphans
