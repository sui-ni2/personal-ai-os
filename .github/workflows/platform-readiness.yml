name: Platform Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "requirements-*.txt"
      - "apps/**"
      - "packages/**"
      - "scripts/release-provider-smoke.py"
      - "scripts/check-mobile-readiness.ps1"
      - "scripts/setup-windows.ps1"
      - ".github/workflows/platform-readiness.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "requirements-*.txt"
      - "apps/**"
      - "packages/**"
      - "scripts/release-provider-smoke.py"
      - "scripts/check-mobile-readiness.ps1"
      - "scripts/setup-windows.ps1"
      - ".github/workflows/platform-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-no-key:
    name: Windows no-key readiness
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Verify Windows first-run bootstrap prerequisites
        run: ./scripts/setup-windows.ps1 -CheckOnly
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify fresh no-key readiness on Windows
        run: python scripts/release-provider-smoke.py --provider openai --no-key-only

  container:
    name: Container build, health, and mobile shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag personal-ai-os:ci .
      - name: Start production image and verify health
        shell: bash
        run: |
          docker run -d \
            --name personal-ai-os-ci \
            -p 127.0.0.1:18080:8080 \
            -e PERSONAL_AI_OS_REQUIRE_AUTH=false \
            personal-ai-os:ci

          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health; then
              echo
              exit 0
            fi
            sleep 2
          done

          echo "Container did not become healthy" >&2
          docker logs personal-ai-os-ci >&2 || true
          exit 1
      - name: Verify production mobile/PWA readiness
        shell: pwsh
        run: |
          ./scripts/check-mobile-readiness.ps1 -BaseUrl "http://127.0.0.1:18080" -AllowInsecureLocalhost
      - name: Clean up container
        if: always()
        run: docker rm -f personal-ai-os-ci >/dev/null 2>&1 || true
