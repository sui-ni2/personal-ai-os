name: Temporary vinext compatibility stack refresh

on:
  push:
    branches:
      - fix/vite-security-8.3.4

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vite-security-8.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable repository pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm --version
      - name: Align runtime compatibility stack
        run: |
          pnpm --filter @personal-ai-os/web add --save-exact \
            @vinext/cloudflare@1.1.1 \
            react@19.3.1 \
            react-dom@19.3.1 \
            react-server-dom-webpack@19.3.1 \
            --lockfile-only
          pnpm --filter @personal-ai-os/web add --save-dev --save-exact \
            vinext@1.2.1 \
            @vitejs/plugin-rsc@0.5.38 \
            vite@8.3.3 \
            --lockfile-only
      - name: Verify generated dependency graph and commit
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('apps/web/package.json', 'utf8'));
          const expectedDeps = {
            '@vinext/cloudflare': '1.1.1',
            react: '19.3.1',
            'react-dom': '19.3.1',
            'react-server-dom-webpack': '19.3.1',
          };
          const expectedDev = {
            vinext: '1.2.1',
            '@vitejs/plugin-rsc': '0.5.38',
            vite: '8.3.3',
          };
          for (const [name, version] of Object.entries(expectedDeps)) {
            if (pkg.dependencies?.[name] !== version) throw new Error(`${name} != ${version}`);
          }
          for (const [name, version] of Object.entries(expectedDev)) {
            if (pkg.devDependencies?.[name] !== version) throw new Error(`${name} != ${version}`);
          }
          const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');
          if (!lock.includes('vite@8.3.3')) throw new Error('lockfile lacks vite 8.3.3');
          if (lock.includes('vite@8.3.0')) throw new Error('vulnerable vite 8.3.0 remains');
          if (!lock.includes('vinext@1.2.1')) throw new Error('lockfile lacks vinext 1.2.1');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json pnpm-lock.yaml
          git diff --cached --quiet && { echo "No dependency changes generated"; exit 1; }
          git commit -m "fix(deps): align vinext stack for patched Vite"
          git push origin HEAD:fix/vite-security-8.3.4
