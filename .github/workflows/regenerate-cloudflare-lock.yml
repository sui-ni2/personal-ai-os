name: Regenerate Cloudflare dependency lock

on:
  push:
    branches:
      - security/sharp-cloudflare-2026-09-15

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/sharp-cloudflare-2026-09-15
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Regenerate lockfile with coordinated Cloudflare versions
        run: pnpm update @cloudflare/vite-plugin@1.54.9 wrangler@4.131.2 --lockfile-only
      - name: Verify vulnerable sharp is gone
        run: |
          if grep -q 'sharp@0\.35\.2' pnpm-lock.yaml; then
            echo 'Vulnerable sharp 0.35.2 remains in the lockfile'
            exit 1
          fi
          grep -q 'sharp@0\.35\.4' pnpm-lock.yaml
      - name: Commit regenerated lockfile and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/regenerate-cloudflare-lock.yml
          git add apps/web/package.json pnpm-lock.yaml
          git commit -m 'chore(deps): regenerate lockfile for Cloudflare security update'
          git push origin HEAD:security/sharp-cloudflare-2026-09-15
