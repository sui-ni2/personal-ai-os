name: Release provider smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  models: read

jobs:
  provider-smoke:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PERSONAL_AI_OS_OPENAI_API_KEY: ${{ secrets.PERSONAL_AI_OS_OPENAI_API_KEY }}
      PERSONAL_AI_OS_ANTHROPIC_API_KEY: ${{ secrets.PERSONAL_AI_OS_ANTHROPIC_API_KEY }}
      PERSONAL_AI_OS_GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Select configured provider without exposing secrets
        id: provider
        shell: bash
        run: |
          if [[ -n "$PERSONAL_AI_OS_OPENAI_API_KEY" ]]; then
            echo "provider=openai" >> "$GITHUB_OUTPUT"
            echo "Using configured OpenAI repository secret."
          elif [[ -n "$PERSONAL_AI_OS_ANTHROPIC_API_KEY" ]]; then
            echo "provider=anthropic" >> "$GITHUB_OUTPUT"
            echo "Using configured Anthropic repository secret."
          elif [[ -n "$PERSONAL_AI_OS_GITHUB_MODELS_TOKEN" ]]; then
            echo "provider=github_models" >> "$GITHUB_OUTPUT"
            echo "Using workflow-scoped GitHub Models token."
          else
            echo "::error title=Real provider smoke blocked::No supported real-provider credential is available."
            exit 1
          fi

      - name: Preflight GitHub Models HTTP status without response body
        if: steps.provider.outputs.provider == 'github_models'
        shell: bash
        run: |
          status="$({
            curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --request POST \
              --url 'https://models.github.ai/inference/chat/completions' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $PERSONAL_AI_OS_GITHUB_MODELS_TOKEN" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --header 'Content-Type: application/json' \
              --data '{"model":"openai/gpt-4.1","messages":[{"role":"user","content":"Reply with exactly OK."}],"stream":false,"max_tokens":8}'
          })"
          echo "GitHub Models preflight HTTP status: $status"
          if [[ "$status" != "200" ]]; then
            echo "::error title=GitHub Models preflight rejected::The real inference endpoint returned HTTP $status. Response content was discarded."
            exit 1
          fi

      - name: Run isolated real-provider release smoke
        run: python scripts/release-provider-smoke.py --provider "${{ steps.provider.outputs.provider }}"
