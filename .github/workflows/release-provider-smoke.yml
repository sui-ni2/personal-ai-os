name: Release provider smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  provider-smoke:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PERSONAL_AI_OS_OPENAI_API_KEY: ${{ secrets.PERSONAL_AI_OS_OPENAI_API_KEY }}
      PERSONAL_AI_OS_ANTHROPIC_API_KEY: ${{ secrets.PERSONAL_AI_OS_ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Select release smoke mode without exposing secrets
        id: provider
        shell: bash
        run: |
          if [[ -n "$PERSONAL_AI_OS_OPENAI_API_KEY" ]]; then
            echo "provider=openai" >> "$GITHUB_OUTPUT"
            echo "no_key_only=false" >> "$GITHUB_OUTPUT"
            echo "Using configured OpenAI repository secret."
          elif [[ -n "$PERSONAL_AI_OS_ANTHROPIC_API_KEY" ]]; then
            echo "provider=anthropic" >> "$GITHUB_OUTPUT"
            echo "no_key_only=false" >> "$GITHUB_OUTPUT"
            echo "Using configured Anthropic repository secret."
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "provider=openai" >> "$GITHUB_OUTPUT"
            echo "no_key_only=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Real provider smoke pending::No supported repository provider secret is configured. Running the non-billable no-key readiness gate for this pull request. A manual release smoke still fails closed until an OpenAI or Anthropic credential is configured."
          else
            echo "::error title=Real provider smoke blocked::Configure PERSONAL_AI_OS_OPENAI_API_KEY or PERSONAL_AI_OS_ANTHROPIC_API_KEY as a repository Actions secret before running the manual release gate."
            exit 1
          fi

      - name: Run non-billable pull-request readiness gate
        if: steps.provider.outputs.no_key_only == 'true'
        run: python scripts/release-provider-smoke.py --provider "${{ steps.provider.outputs.provider }}" --no-key-only

      - name: Run isolated real-provider release smoke
        if: steps.provider.outputs.no_key_only != 'true'
        run: python scripts/release-provider-smoke.py --provider "${{ steps.provider.outputs.provider }}"
