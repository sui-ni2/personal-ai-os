name: Temporary Vite lockfile refresh

on:
  push:
    branches:
      - fix/vite-security-8.3.4

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vite-security-8.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm --version
      - name: Pin patched Vite and refresh lockfile
        run: pnpm --filter @personal-ai-os/web add --save-dev --save-exact vite@8.3.4 --lockfile-only
      - name: Verify and commit generated files
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('apps/web/package.json', 'utf8'));
          if (pkg.devDependencies?.vite !== '8.3.4') {
            throw new Error('apps/web/package.json does not pin vite 8.3.4');
          }
          const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');
          if (!lock.includes('vite@8.3.4')) {
            throw new Error('pnpm-lock.yaml does not contain vite 8.3.4');
          }
          if (lock.includes('vite@8.3.0')) {
            throw new Error('pnpm-lock.yaml still contains vulnerable vite 8.3.0');
          }
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json pnpm-lock.yaml
          git diff --cached --exit-code && { echo "No lockfile changes generated"; exit 1; } || true
          git commit -m "fix(deps): pin Vite 8.3.4"
          git push origin HEAD:fix/vite-security-8.3.4
