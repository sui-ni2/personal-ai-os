name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check internal package version consistency
        run: python scripts/check_internal_versions.py
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest apps/api/tests -q
      - name: Compile Python sources
        run: python -m compileall -q apps/api/src packages
      - name: Verify fresh no-key readiness
        run: python scripts/release-provider-smoke.py --provider openai --no-key-only

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check web app
        run: pnpm check:web
      - name: Build web app
        run: pnpm build:web
